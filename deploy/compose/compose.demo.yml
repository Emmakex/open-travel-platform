services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: open-travel-platform:compose-demo
    env_file:
      - ../../.env.demo.example
    ports:
      - "127.0.0.1:3000:3000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

name: Content UX Audit

on:
  push:
    branches: [audit/full-content-ux-review]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Inventory static UI copy
        run: node scripts/content-copy-inventory.mjs

      - name: Crawl live public content
        env:
          AUDIT_BASE_URL: https://travel.kairoseth.com
        run: node scripts/live-content-crawl.mjs

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: full-content-ux-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 7

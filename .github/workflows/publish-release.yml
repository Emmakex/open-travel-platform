name: Publish audited release

on:
  workflow_run:
    workflows: ["Release audit"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-audited-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUDITED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact audited main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve approved release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          AUDIT="docs/RELEASE-AUDIT-${VERSION}.md"
          NOTES="docs/RELEASE-NOTES-${VERSION}.md"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "$AUDIT"
          test -f "$NOTES"
          grep -Fq "RELEASE APPROVED FOR ${TAG}" "$AUDIT"
          grep -Fq "## [${VERSION}] - " CHANGELOG.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Preserve immutable release history
        id: history
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [[ -n "$EXISTING" ]]; then
            echo "Tag ${TAG} already exists; it will never be moved or recreated."
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Existing tag ${TAG} has no GitHub Release; refusing to rewrite release history." >&2
              exit 1
            fi
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            echo "Existing ${TAG} resolves to ${TAG_COMMIT}; audited main is ${AUDITED_SHA}."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable audited tag
        if: steps.history.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$AUDITED_SHA" -m "Open Travel Platform ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Publish GitHub Release
        if: steps.history.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Open Travel Platform ${TAG}" \
            --notes-file "docs/RELEASE-NOTES-${VERSION}.md"

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "Audited release ${TAG} is published."

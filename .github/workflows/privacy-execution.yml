name: Privacy execution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: privacy-execution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB_NAME: ktravel_privacy_execution_${{ github.run_id }}_${{ github.run_attempt }}
      NEXT_PUBLIC_DATA_MODE: demo
      TRAVEL_DATA_MODE: disabled
      IDENTITY_MODE: disabled
      STAFF_AUTH_MODE: disabled
      BOOKING_MODE: disabled
      OPERATIONS_MODE: disabled
      PAYMENT_LEDGER_MODE: disabled
      KTRAVEL_DEPLOYMENT_PROFILE: demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Privacy-execution invariant check
        run: npm run check:privacy-execution

      - name: Start MongoDB 8.0 replica set
        run: |
          docker run --rm -d \
            --name otp-mongo-privacy-execution \
            -p 27017:27017 \
            mongo:8.0.29 \
            --replSet rs0 \
            --bind_ip_all

          reachable=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-privacy-execution mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              reachable=true
              break
            fi
            sleep 1
          done
          test "$reachable" = "true"

          docker exec otp-mongo-privacy-execution mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

          primary=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-privacy-execution mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              primary=true
              break
            fi
            sleep 1
          done
          test "$primary" = "true"

      - name: Privacy execution MongoDB test
        run: npm run test:mongodb-privacy-execution

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: MongoDB diagnostics on failure
        if: failure()
        run: docker logs otp-mongo-privacy-execution || true

      - name: Stop MongoDB test container
        if: always()
        run: docker rm -f otp-mongo-privacy-execution || true

name: Accessible Traveller Data and privacy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: accessibility-traveller-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB_NAME: ktravel_ci_accessibility_tp_${{ github.run_id }}_${{ github.run_attempt }}
      NEXT_PUBLIC_DATA_MODE: demo
      TRAVEL_DATA_MODE: mongodb
      IDENTITY_MODE: mongodb
      STAFF_AUTH_MODE: disabled
      BOOKING_MODE: mongodb
      OPERATIONS_MODE: disabled
      PAYMENT_LEDGER_MODE: mongodb
      KTRAVEL_DEPLOYMENT_PROFILE: demo
      KTRAVEL_PUBLIC_URL: http://127.0.0.1:3000
      TRAVELLER_DATA_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TRAVELLER_DATA_KEY_ID: accessibility-ci-v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Traveller/privacy accessibility source invariants
        run: npm run check:accessibility-traveller-privacy

      - name: Start MongoDB 8.0 replica set
        run: |
          docker run --rm -d \
            --name otp-mongo-accessibility-tp \
            -p 27017:27017 \
            mongo:8.0.29 \
            --replSet rs0 \
            --bind_ip_all

          reachable=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-accessibility-tp mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              reachable=true
              break
            fi
            sleep 1
          done
          test "$reachable" = "true"

          docker exec otp-mongo-accessibility-tp mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

          primary=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-accessibility-tp mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              primary=true
              break
            fi
            sleep 1
          done
          test "$primary" = "true"

      - name: Seed controlled catalogue and departure
        run: npm run test:e2e:seed

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Blocking Traveller Data and privacy accessibility smoke
        run: npm run test:accessibility-traveller-privacy

      - name: MongoDB diagnostics on failure
        if: failure()
        run: docker logs otp-mongo-accessibility-tp || true

      - name: Stop MongoDB test container
        if: always()
        run: docker rm -f otp-mongo-accessibility-tp || true

name: Accessibility foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_DATA_MODE: demo
      IDENTITY_MODE: disabled
      BOOKING_MODE: disabled
      OPERATIONS_MODE: disabled
      KTRAVEL_DEPLOYMENT_PROFILE: demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Accessibility source and documentation invariants
        run: npm run check:accessibility-foundation

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Blocking keyboard, focus, motion and reflow smoke
        run: npm run test:accessibility-smoke

name: Registry publication and provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Clean install from resolved lock
        run: npm ci --no-fund --no-audit

      - name: Registry publication and provenance invariants
        run: npm run check:registry-provenance

      - name: Preserve container distribution invariants
        run: npm run check:container

      - name: Preserve release and migration invariants
        run: npm run check:release-migrations

      - name: Preserve audited release invariants
        run: npm run check:phase-10-release

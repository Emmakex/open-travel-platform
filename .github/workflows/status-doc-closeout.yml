              "- [`docs/ACCESSIBILITY-OPERATOR.es.md`](docs/ACCESSIBILITY-OPERATOR.es.md) / [`docs/ACCESSIBILITY-OPERATOR.md`](docs/ACCESSIBILITY-OPERATOR.md) — cierre de accesibilidad Operator, semántica de feedback/formularios y frontera de revisión manual.\n- [`docs/PERFORMANCE-LOAD-READINESS.es.md`](docs/PERFORMANCE-LOAD-READINESS.es.md) / [`docs/PERFORMANCE-LOAD-READINESS.md`](docs/PERFORMANCE-LOAD-READINESS.md) — consolidado 9D-5 de latencia, throughput, supuestos de capacidad y seguimiento productivo.\n- [`docs/PERFORMANCE-MUTATION-THROUGHPUT.es.md`](docs/PERFORMANCE-MUTATION-THROUGHPUT.es.md) / [`docs/PERFORMANCE-MUTATION-THROUGHPUT.md`](docs/PERFORMANCE-MUTATION-THROUGHPUT.md) — contención acotada de reservas/cancelaciones y corrección post-carga.\n- [`docs/PERFORMANCE-RUNTIME-RESOURCE.es.md`](docs/PERFORMANCE-RUNTIME-RESOURCE.es.md) / [`docs/PERFORMANCE-RUNTIME-RESOURCE.md`](docs/PERFORMANCE-RUNTIME-RESOURCE.md) — baseline runtime RSS/descriptores/threads, recuperación ante pico y guía de capacidad."
          )
          replace_exact(
              "README.es.md",
              "check:accessibility-operator\ncheck:browser-e2e",
              "check:accessibility-operator\ncheck:performance-load\ncheck:performance-authenticated-read\ncheck:performance-mutation-throughput\ncheck:performance-runtime-resource\ncheck:browser-e2e"
          )
          replace_exact(
              "README.es.md",
              "CI realiza instalación limpia, invariantes deterministas, typecheck y build productivo. Jobs bloqueantes dedicados ejercitan replica sets MongoDB 8 reales, contratos HTTP locales, rollback de auditoría privilegiada, rotación de claves, backup/restore, planes de consulta, ejecución de privacidad y journeys críticos de accesibilidad en Chromium. El Browser E2E general registro → reserva → cliente → Operator sigue siendo informativo/no bloqueante por política; los browser gates específicos de accesibilidad son bloqueantes.",
              "CI realiza instalación limpia, invariantes deterministas, typecheck y build productivo. Jobs bloqueantes dedicados ejercitan replica sets MongoDB 8 reales, contratos HTTP locales, rollback de auditoría privilegiada, rotación de claves, backup/restore, planes de consulta, ejecución de privacidad, journeys críticos de accesibilidad en Chromium y los cuatro slices de rendimiento/carga: lecturas públicas, lecturas autenticadas, mutaciones acotadas y recuperación del runtime tras pico. El Browser E2E general registro → reserva → cliente → Operator sigue siendo informativo/no bloqueante por política; los browser gates específicos de accesibilidad son bloqueantes."
          )
          replace_exact(
              "README.es.md",
              "| Fase 9D-5 — Preparación de rendimiento/carga | **Siguiente** |\n| Fase 9 — Endurecimiento productivo | **En progreso** |",
              "| Fase 9D-5 — Preparación de rendimiento/carga | **Completada** |\n| Fase 9 — Baseline de ingeniería de endurecimiento productivo | **Completado; validación con credenciales proveedor pendiente** |\n| Fase 10 — Productización open-source | **Siguiente** |"
          )
          old_next_es = """El siguiente bloque es la **Fase 9D-5 — Preparación de rendimiento/carga**.

El baseline de base de datos e índices ya está validado con planes de consulta MongoDB reales, por lo que esta fase debe medir el sistema antes de añadir optimizaciones especulativas. Dirección inicial:

- definir escenarios de carga repetibles para cliente y Operator con datos persistentes MongoDB;
- capturar distribuciones de latencia server-side y tasas de éxito/error en paths representativos;
- probar concurrencia acotada en catálogo/búsqueda, lecturas autenticadas de cuenta, paths seguros cercanos a booking y colas Operator sin debilitar autoridad de inventario/pagos;
- separar budgets reproducibles de CI de los objetivos reales de capacidad productiva;
- documentar supuestos de recursos/capacidad y señales productivas que obliguen a volver a medir o escalar;
- fallar de forma acotada bajo sobrecarga y dejar explícito qué depende del hosting/containers/MongoDB gestionado de cada despliegue."""
          new_next_es = """El siguiente bloque es la **Fase 10 — Productización open-source**.

El baseline de ingeniería de endurecimiento productivo está completado. El siguiente trabajo debe facilitar adoptar, extender y publicar un clon limpio sin mezclar infraestructura exclusiva de Kairoseth dentro del core MIT:

- validar seed/setup demo limpio desde un clon nuevo;
- publicar instalación/despliegue desde clon limpio y un ejemplo opcional Docker/self-host;
- formalizar adapters de referencia y contratos de extensión para capacidades externas;
- definir convenciones versionadas de release y migraciones;
- añadir templates de contribución y documentación pública de API/extensiones;
- documentar reglas de trademark/branding entre el core open-source y Kairoseth Travel;
- mantener fuera del core público los adapters propietarios Kairoseth/cliente cuando corresponda."""
          replace_exact("README.es.md", old_next_es, new_next_es)

          # ROADMAP EN
          replace_exact(
              "ROADMAP.md",
              "**Phase 8 is COMPLETE. Phase 9 — Production hardening is IN PROGRESS: Phase 9A production security / operability baseline, Phase 9B critical persistence/concurrency/contract validation baseline and Phase 9C observability/recovery/privileged-audit hardening are COMPLETE. Phase 9D is IN PROGRESS: 9D-1 privacy-rights workflow, 9D-2 access/portability/restriction/controlled erasure, 9D-3 regulatory retention-policy baseline and 9D-4 accessibility readiness are COMPLETE. Phase 9D-5 performance/load readiness is NEXT.**",
              "**Phase 8 is COMPLETE. The Phase 9 — Production hardening engineering baseline is COMPLETE: Phase 9A production security/operability, Phase 9B critical persistence/concurrency/contract validation, Phase 9C observability/recovery/privileged-audit hardening and Phase 9D privacy/regulatory/accessibility/performance readiness are COMPLETE. Phase 10 — Open-source productisation is NEXT.**"
          )
          replace_exact(
              "ROADMAP.md",
              "but it does not block Phase 9D.",
              "It remains an explicit external-dependency release validation and does not reopen the completed Phase 9 engineering baseline."
          )
          replace_exact("ROADMAP.md", "# Phase 9 — Production hardening — IN PROGRESS", "# Phase 9 — Production hardening — COMPLETE (engineering baseline)")
          replace_exact("ROADMAP.md", "The priority is to harden the already broad product surface for real production operation.", "The engineering hardening baseline for the broad product surface is complete. Provider-credential validation remains separately tracked where external accounts are required.")
          replace_exact("ROADMAP.md", "## 9D — Privacy, regulatory, accessibility and performance readiness — IN PROGRESS", "## 9D — Privacy, regulatory, accessibility and performance readiness — COMPLETE")
          old_9d5_en = """### 9D-5 — Performance/load readiness — NEXT
- establish repeatable performance/load baselines for customer booking/account and Operator critical paths;
- validate server latency, concurrency/resource behavior and bounded failure under representative load;
- build on the completed MongoDB query-plan/index baseline rather than adding speculative indexes;
- document capacity assumptions and production follow-up thresholds."""
          new_9d5_en = """### 9D-5 — Performance/load readiness — COMPLETE
- 9D-5.1 adds a blocking production-build public/read-only HTTP baseline with structured p50/p95/p99, throughput and failure counts; the first accepted run completed 150 requests with 0 failures;
- 9D-5.2 uses real persistent customer/Admin sessions and a real MongoDB reservation fixture for authenticated critical GET load, with no auth bypass; the first accepted run completed 156 requests with 0 failures and p95 values of roughly 45.58–111.26 ms;
- 9D-5.3 runs 32 concurrent reservation attempts against 16 spaces, requires exactly 16 commits + 16 expected capacity rejections, then cancels all commits and proves final inventory 0 plus exact transactional outbox cardinality; first accepted create/cancel p95 values were 554.78/323.5 ms;
- 9D-5.4 samples a production Next.js Linux process for RSS/VmHWM, file descriptors and threads during 240 requests at concurrency 12 plus a 320-request spike at concurrency 32; the first accepted run had 0 failures, p95 109.10/233.10 ms, RSS 193.78 → 395.74 MB, FDs 40 → 84, threads 15 → 15 and successful post-load liveness;
- CI budgets are regression/leak signals, not production SLOs or sizing guarantees; real deployment thresholds must be calibrated from hosting, Atlas and traffic telemetry;
- Phase 9C-8 query-plan evidence remains authoritative for database/index changes, so slow application scenarios do not justify speculative indexes."""
          replace_exact("ROADMAP.md", old_9d5_en, new_9d5_en)
          replace_exact("ROADMAP.md", "# Phase 10 — Open-source productisation", "# Phase 10 — Open-source productisation — NEXT")
          replace_exact("ROADMAP.md", "9D-5  Performance/load readiness — NEXT", "9D-5  Performance/load readiness — COMPLETE")
          replace_exact("ROADMAP.md", "10    Open-source productisation / release", "10    Open-source productisation / release — NEXT")

          # ROADMAP ES
          replace_exact(
              "ROADMAP.es.md",
              "**La Fase 8 está COMPLETADA. La Fase 9 — Endurecimiento productivo está EN PROGRESO: la Fase 9A de seguridad / operabilidad productiva, el baseline crítico de persistencia/concurrencia/contratos de la Fase 9B y la Fase 9C de observabilidad/recuperación/auditoría privilegiada están COMPLETADOS. La Fase 9D está EN PROGRESO: 9D-1 de derechos de privacidad, 9D-2 de acceso/portabilidad/limitación/supresión controlada, 9D-3 de baseline regulatorio de retención y 9D-4 de accesibilidad están COMPLETADOS. La Fase 9D-5 de rendimiento/carga es la SIGUIENTE.**",
              "**La Fase 8 está COMPLETADA. El baseline de ingeniería de la Fase 9 — Endurecimiento productivo está COMPLETADO: Fase 9A de seguridad/operabilidad productiva, Fase 9B de persistencia/concurrencia/contratos críticos, Fase 9C de observabilidad/recuperación/auditoría privilegiada y Fase 9D de privacidad/regulación/accesibilidad/rendimiento. La Fase 10 — Productización open-source es la SIGUIENTE.**"
          )
          replace_exact(
              "ROADMAP.es.md",
              "pero no bloquea la Fase 9D.",
              "Permanece como validación de release dependiente de proveedores y no reabre el baseline de ingeniería completado de la Fase 9."

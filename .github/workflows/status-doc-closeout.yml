name: Phase 9D-5 status documentation closeout

on:
  push:
    branches:
      - feat/phase-9d5-runtime-resource-closeout

permissions:
  contents: write

jobs:
  update-status-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/phase-9d5-runtime-resource-closeout

      - name: Apply final documentation cleanup
        run: python scripts/status-doc-closeout-fix.py

      - name: Commit synchronized status docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md ROADMAP.md ROADMAP.es.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Polish Phase 9D-5 documentation closeout"
          git push origin HEAD:feat/phase-9d5-runtime-resource-closeout

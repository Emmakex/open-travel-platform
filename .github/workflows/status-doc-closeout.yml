name: Phase 9D-5 status documentation closeout

on:
  push:
    branches:
      - feat/phase-9d5-runtime-resource-closeout

permissions:
  contents: write

jobs:
  update-status-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/phase-9d5-runtime-resource-closeout

      - name: Update README and ROADMAP status atomically
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # README EN
          replace_exact(
              "README.md",
              "- a WCAG 2.2 AA-oriented accessibility engineering baseline across global navigation, customer authentication, Traveller Data/privacy, booking/payment and Operator workflows, backed by dedicated blocking browser journeys.",
              "- a WCAG 2.2 AA-oriented accessibility engineering baseline across global navigation, customer authentication, Traveller Data/privacy, booking/payment and Operator workflows, backed by dedicated blocking browser journeys.\n- repeatable performance/load baselines covering public and authenticated reads, bounded mutation contention, runtime RSS/file-descriptor/thread behavior and post-spike liveness/recovery."
          )
          replace_exact(
              "README.md",
              "**Phase 8 — External integrations is COMPLETE. Phase 9 — Production hardening is IN PROGRESS: Phase 9A production security, Phase 9B critical validation and Phase 9C observability/recovery/privileged-audit hardening are COMPLETE. Phase 9D-1 privacy rights, 9D-2 privacy execution, 9D-3 regulatory retention and 9D-4 accessibility readiness are COMPLETE. Phase 9D-5 performance/load readiness is NEXT.**",
              "**Phase 8 — External integrations is COMPLETE. The Phase 9 — Production hardening engineering baseline is COMPLETE across Phase 9A production security, Phase 9B critical validation, Phase 9C observability/recovery/privileged-audit hardening and Phase 9D privacy/regulatory/accessibility/performance readiness. Phase 10 — Open-source productisation is NEXT.**"
          )
          replace_exact(
              "README.md",
              "- [`docs/ACCESSIBILITY-OPERATOR.md`](docs/ACCESSIBILITY-OPERATOR.md) / [`docs/ACCESSIBILITY-OPERATOR.es.md`](docs/ACCESSIBILITY-OPERATOR.es.md) — Operator accessibility closeout, live-region/form semantics and manual review boundary.",
              "- [`docs/ACCESSIBILITY-OPERATOR.md`](docs/ACCESSIBILITY-OPERATOR.md) / [`docs/ACCESSIBILITY-OPERATOR.es.md`](docs/ACCESSIBILITY-OPERATOR.es.md) — Operator accessibility closeout, live-region/form semantics and manual review boundary.\n- [`docs/PERFORMANCE-LOAD-READINESS.md`](docs/PERFORMANCE-LOAD-READINESS.md) / [`docs/PERFORMANCE-LOAD-READINESS.es.md`](docs/PERFORMANCE-LOAD-READINESS.es.md) — consolidated Phase 9D-5 latency, throughput, capacity assumptions and production follow-up.\n- [`docs/PERFORMANCE-MUTATION-THROUGHPUT.md`](docs/PERFORMANCE-MUTATION-THROUGHPUT.md) / [`docs/PERFORMANCE-MUTATION-THROUGHPUT.es.md`](docs/PERFORMANCE-MUTATION-THROUGHPUT.es.md) — bounded booking/cancellation contention and post-load correctness.\n- [`docs/PERFORMANCE-RUNTIME-RESOURCE.md`](docs/PERFORMANCE-RUNTIME-RESOURCE.md) / [`docs/PERFORMANCE-RUNTIME-RESOURCE.es.md`](docs/PERFORMANCE-RUNTIME-RESOURCE.es.md) — runtime RSS/file-descriptor/thread baseline, bounded spike recovery and capacity guidance."
          )
          replace_exact(
              "README.md",
              "check:accessibility-operator\ncheck:browser-e2e",
              "check:accessibility-operator\ncheck:performance-load\ncheck:performance-authenticated-read\ncheck:performance-mutation-throughput\ncheck:performance-runtime-resource\ncheck:browser-e2e"
          )
          replace_exact(
              "README.md",
              "CI performs a clean install, runs deterministic invariants, type-checks and builds the production application. Dedicated blocking jobs exercise real MongoDB 8 replica sets, local HTTP adapter contracts, privileged-audit rollback, key rotation, backup/restore, query plans, privacy execution and critical accessibility journeys in Chromium. The broad registration → booking → customer → Operator Browser E2E remains a separate informational/non-blocking signal by policy; feature-specific accessibility browser gates are blocking.",
              "CI performs a clean install, runs deterministic invariants, type-checks and builds the production application. Dedicated blocking jobs exercise real MongoDB 8 replica sets, local HTTP adapter contracts, privileged-audit rollback, key rotation, backup/restore, query plans, privacy execution, critical accessibility journeys in Chromium and the four performance/load slices: public reads, authenticated reads, bounded mutations and runtime-resource spike recovery. The broad registration → booking → customer → Operator Browser E2E remains a separate informational/non-blocking signal by policy; feature-specific accessibility browser gates are blocking."
          )
          replace_exact(
              "README.md",
              "| Phase 9D-5 — Performance/load readiness | **Next** |\n| Phase 9 — Production hardening | **In progress** |",
              "| Phase 9D-5 — Performance/load readiness | **Complete** |\n| Phase 9 — Production hardening engineering baseline | **Complete; provider credentialed validation pending** |\n| Phase 10 — Open-source productisation | **Next** |"
          )
          old_next_en = """The next block is **Phase 9D-5 — Performance/load readiness**.

The database/index baseline is already validated with real MongoDB query plans, so this phase is about measuring the system rather than adding speculative optimization. The initial direction is:

- establish repeatable customer and Operator load scenarios using persistent MongoDB-backed data;
- capture server-side latency distributions and request success/error rates for representative read and mutation paths;
- exercise bounded concurrency around catalogue/search, authenticated account reads, booking-adjacent safe paths and Operator queues without weakening existing inventory/payment authority;
- define explicit CI-friendly baseline budgets separately from production capacity targets;
- record resource/capacity assumptions and the production observability signals that should trigger remeasurement or scaling;
- fail safely under overload and document what remains deployment-specific for Hostinger/containers/managed MongoDB or other hosting choices."""
          new_next_en = """The next block is **Phase 10 — Open-source productisation**.

The production-hardening engineering baseline is complete. The next work should make a fresh public clone easier to adopt, extend and release without mixing Kairoseth-only infrastructure into the MIT core:

- validate a clean demo seed/setup from a fresh clone;
- publish a fresh-clone install/deployment path and an optional Docker/self-host reference;
- formalize reference adapters and extension contracts for external capabilities;
- define versioned release and migration conventions;
- add contribution templates and public API/extension documentation;
- document trademark/branding rules for the open-source core versus Kairoseth Travel;
- keep proprietary Kairoseth/customer adapters outside the public core where appropriate."""
          replace_exact("README.md", old_next_en, new_next_en)

          # README ES
          replace_exact(
              "README.es.md",
              "- baseline técnico de accesibilidad orientado a WCAG 2.2 AA en navegación global, autenticación cliente, Traveller Data/privacidad, booking/pagos y workflows Operator, respaldado por journeys bloqueantes de navegador.",
              "- baseline técnico de accesibilidad orientado a WCAG 2.2 AA en navegación global, autenticación cliente, Traveller Data/privacidad, booking/pagos y workflows Operator, respaldado por journeys bloqueantes de navegador.\n- baselines repetibles de rendimiento/carga para lecturas públicas y autenticadas, contención acotada de mutaciones, comportamiento runtime de RSS/descriptores/threads y liveness/recuperación post-pico."
          )
          replace_exact(
              "README.es.md",
              "**La Fase 8 — Integraciones externas está COMPLETADA. La Fase 9 — Endurecimiento productivo está EN PROGRESO: la Fase 9A de seguridad productiva, la Fase 9B de validación crítica y la Fase 9C de observabilidad/recuperación/auditoría privilegiada están COMPLETADAS. Las Fases 9D-1 derechos de privacidad, 9D-2 ejecución de privacidad, 9D-3 retención regulatoria y 9D-4 accesibilidad están COMPLETADAS. La Fase 9D-5 de rendimiento/carga es la SIGUIENTE.**",
              "**La Fase 8 — Integraciones externas está COMPLETADA. El baseline de ingeniería de la Fase 9 — Endurecimiento productivo está COMPLETADO: Fase 9A de seguridad productiva, Fase 9B de validación crítica, Fase 9C de observabilidad/recuperación/auditoría privilegiada y Fase 9D de privacidad/regulación/accesibilidad/rendimiento. La Fase 10 — Productización open-source es la SIGUIENTE.**"
          )
          replace_exact(
              "README.es.md",

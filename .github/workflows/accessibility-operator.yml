name: Accessible Operator workflows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: accessibility-operator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB_NAME: ktravel_ci_accessibility_operator_${{ github.run_id }}_${{ github.run_attempt }}
      KTRAVEL_PUBLIC_URL: http://127.0.0.1:3000
      KTRAVEL_DEPLOYMENT_PROFILE: demo
      NEXT_PUBLIC_DATA_MODE: demo
      TRAVEL_DATA_MODE: disabled
      IDENTITY_MODE: mongodb
      STAFF_AUTH_MODE: mongodb
      BOOKING_MODE: mongodb
      OPERATIONS_MODE: mongodb
      PAYMENT_LEDGER_MODE: mongodb
      DEMO_IDENTITY_ENABLED: false
      DEMO_BOOKING_ENABLED: false
      DEMO_OPERATIONS_ENABLED: false
      CRM_SYNC_MODE: disabled
      ERP_ACCOUNTING_MODE: disabled
      SUPPLIER_FULFILMENT_ADAPTER_MODE: disabled
      KTRAVEL_BOOTSTRAP_ADMIN_EMAIL: accessibility-operator-admin@example.test
      KTRAVEL_BOOTSTRAP_ADMIN_PASSWORD: Accessibility-Operator-Admin-2026
      KTRAVEL_BOOTSTRAP_ADMIN_NAME: Accessibility Operator Admin
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Operator accessibility source invariants
        run: npm run check:accessibility-operator

      - name: Start MongoDB 8.0 replica set
        run: |
          docker run --rm -d \
            --name otp-mongo-accessibility-operator \
            -p 27017:27017 \
            mongo:8.0.29 \
            --replSet rs0 \
            --bind_ip_all

          reachable=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-accessibility-operator mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              reachable=true
              break
            fi
            sleep 1
          done
          test "$reachable" = "true"

          docker exec otp-mongo-accessibility-operator mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

          primary=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-accessibility-operator mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              primary=true
              break
            fi
            sleep 1
          done
          test "$primary" = "true"

      - name: Seed controlled catalogue and departure
        run: npm run test:e2e:seed

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Blocking Operator accessibility smoke
        run: npm run test:accessibility-operator

      - name: MongoDB diagnostics on failure
        if: failure()
        run: docker logs otp-mongo-accessibility-operator || true

      - name: Stop MongoDB test container
        if: always()
        run: docker rm -f otp-mongo-accessibility-operator || true

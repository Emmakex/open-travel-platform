name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_DATA_MODE: demo
      IDENTITY_MODE: disabled
      BOOKING_MODE: disabled
      OPERATIONS_MODE: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Public safety check
        run: npm run check:safety

      - name: UX and public-copy check
        run: npm run check:ux

      - name: Release consistency check
        run: npm run check:release

      - name: Reservation amendment invariant check
        run: npm run check:amendments

      - name: Accommodation invariant check
        run: npm run check:accommodation

      - name: Package supplement invariant check
        run: npm run check:package-addons

      - name: Package supplement amendment invariant check
        run: npm run check:package-addon-amendments

      - name: Reservation operations invariant check
        run: npm run check:operations

      - name: Operations task invariant check
        run: npm run check:tasks

      - name: Supplier fulfilment invariant check
        run: npm run check:fulfilment

      - name: Operations queue invariant check
        run: npm run check:operations-queue

      - name: Staff permission invariant check
        run: npm run check:staff-permissions

      - name: Booking document invariant check
        run: npm run check:booking-documents

      - name: Departure document invariant check
        run: npm run check:departure-documents

      - name: Voucher and dossier document invariant check
        run: npm run check:voucher-documents

      - name: Reporting and export invariant check
        run: npm run check:reporting-exports

      - name: Outbound integration invariant check
        run: npm run check:outbound-integrations

      - name: Integration operations invariant check
        run: npm run check:integration-operations

      - name: Type check
        run: npm run typecheck

      - name: Production build with safe capability defaults
        run: npm run build

      - name: HTTP smoke tests
        run: |
          npm start > /tmp/open-travel-platform.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/open-travel-platform.log
            exit 1
          fi

          for path in \
            / \
            /destinations \
            /trips \
            /trips/barcelona-city-break \
            /trips/barcelona-city-break/book \
            /account/sign-in \
            /operator/sign-in \
            /account \
            /operator; do
            curl -fsSL "http://127.0.0.1:3000${path}" > /dev/null
          done

      - name: Dependency audit
        run: npm audit --audit-level=high

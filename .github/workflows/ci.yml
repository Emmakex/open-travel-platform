name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_DATA_MODE: demo
      IDENTITY_MODE: disabled
      BOOKING_MODE: disabled
      OPERATIONS_MODE: disabled
      KTRAVEL_DEPLOYMENT_PROFILE: demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Public safety check
        run: npm run check:safety

      - name: UX and public-copy check
        run: npm run check:ux

      - name: Release consistency check
        run: npm run check:release

      - name: Reservation amendment invariant check
        run: npm run check:amendments

      - name: Accommodation invariant check
        run: npm run check:accommodation

      - name: Package supplement invariant check
        run: npm run check:package-addons

      - name: Package supplement amendment invariant check
        run: npm run check:package-addon-amendments

      - name: Reservation operations invariant check
        run: npm run check:operations

      - name: Operations task invariant check
        run: npm run check:tasks

      - name: Supplier fulfilment invariant check
        run: npm run check:fulfilment

      - name: Operations queue invariant check
        run: npm run check:operations-queue

      - name: Staff permission invariant check
        run: npm run check:staff-permissions

      - name: Booking document invariant check
        run: npm run check:booking-documents

      - name: Departure document invariant check
        run: npm run check:departure-documents

      - name: Voucher and dossier document invariant check
        run: npm run check:voucher-documents

      - name: Reporting and export invariant check
        run: npm run check:reporting-exports

      - name: Outbound integration invariant check
        run: npm run check:outbound-integrations

      - name: Integration operations invariant check
        run: npm run check:integration-operations

      - name: Generic REST booking adapter invariant check
        run: npm run check:rest-booking-adapter

      - name: Supplier fulfilment adapter invariant check
        run: npm run check:supplier-fulfilment-adapter

      - name: CRM synchronization adapter invariant check
        run: npm run check:crm-sync-adapter

      - name: ERP accounting adapter invariant check
        run: npm run check:erp-accounting-adapter

      - name: Production security invariant check
        run: npm run check:production-security

      - name: MongoDB concurrency CI invariant check
        run: npm run check:mongodb-concurrency

      - name: Payment idempotency invariant check
        run: npm run check:payment-idempotency

      - name: Type check
        run: npm run typecheck

      - name: Production build with safe capability defaults
        run: npm run build

      - name: HTTP smoke tests
        run: |
          npm start > /tmp/open-travel-platform.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health/live > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/open-travel-platform.log
            exit 1
          fi

          for path in \
            / \
            /destinations \
            /trips \
            /trips/barcelona-city-break \
            /trips/barcelona-city-break/book \
            /account/sign-in \
            /operator/sign-in \
            /account \
            /operator \
            /api/health/live \
            /api/health/ready; do
            curl -fsSL "http://127.0.0.1:3000${path}" > /dev/null
          done

          curl -fsSI http://127.0.0.1:3000/ > /tmp/security-headers.txt
          grep -qi '^content-security-policy:' /tmp/security-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/security-headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/security-headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/security-headers.txt

          cross_origin_status=$(curl -sS -o /tmp/cross-origin.json -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://attacker.invalid' \
            http://127.0.0.1:3000/api/operator/media)
          test "$cross_origin_status" = "403"
          grep -q 'invalid-origin' /tmp/cross-origin.json

      - name: Dependency audit
        run: npm audit --audit-level=high

  mongodb-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB_NAME: ktravel_ci_${{ github.run_id }}_${{ github.run_attempt }}
      CRM_SYNC_MODE: disabled
      ERP_ACCOUNTING_MODE: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Start MongoDB 8.0 replica set
        run: |
          docker run --rm -d \
            --name otp-mongo-rs \
            -p 27017:27017 \
            mongo:8.0.29 \
            --replSet rs0 \
            --bind_ip_all

          reachable=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-rs mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              reachable=true
              break
            fi
            sleep 1
          done
          test "$reachable" = "true"

          docker exec otp-mongo-rs mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

          primary=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              primary=true
              break
            fi
            sleep 1
          done
          test "$primary" = "true"

      - name: MongoDB booking concurrency and rollback test
        run: npm run test:mongodb-concurrency

      - name: MongoDB payment and webhook idempotency test
        env:
          PAYMENT_LEDGER_MODE: mongodb
          ERP_ACCOUNTING_MODE: rest
          REST_ERP_ACCOUNTING_BASE_URL: https://erp.invalid/
          REST_ERP_ACCOUNTING_BEARER_TOKEN: ci-payment-idempotency-token
        run: npm run test:mongodb-payment-idempotency

      - name: MongoDB diagnostics on failure
        if: failure()
        run: docker logs otp-mongo-rs || true

      - name: Stop MongoDB test container
        if: always()
        run: docker rm -f otp-mongo-rs || true

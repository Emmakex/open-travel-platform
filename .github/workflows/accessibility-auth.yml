name: Accessible customer authentication

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: accessibility-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB_NAME: ktravel_accessibility_auth_${{ github.run_id }}_${{ github.run_attempt }}
      NEXT_PUBLIC_DATA_MODE: demo
      TRAVEL_DATA_MODE: disabled
      IDENTITY_MODE: mongodb
      STAFF_AUTH_MODE: disabled
      BOOKING_MODE: disabled
      OPERATIONS_MODE: disabled
      PAYMENT_LEDGER_MODE: disabled
      KTRAVEL_DEPLOYMENT_PROFILE: demo
      SMTP_HOST: smtp.invalid.example
      SMTP_PORT: "465"
      SMTP_USER: accessibility@example.test
      SMTP_PASSWORD: test-only-placeholder
      SMTP_FROM_EMAIL: accessibility@example.test
      KTRAVEL_PUBLIC_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Accessible-auth source and documentation invariants
        run: npm run check:accessibility-auth

      - name: Start MongoDB 8.0 replica set
        run: |
          docker run --rm -d \
            --name otp-mongo-accessibility-auth \
            -p 27017:27017 \
            mongo:8.0.29 \
            --replSet rs0 \
            --bind_ip_all

          reachable=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-accessibility-auth mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              reachable=true
              break
            fi
            sleep 1
          done
          test "$reachable" = "true"

          docker exec otp-mongo-accessibility-auth mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

          primary=false
          for attempt in {1..30}; do
            if docker exec otp-mongo-accessibility-auth mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              primary=true
              break
            fi
            sleep 1
          done
          test "$primary" = "true"

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Blocking customer auth accessibility smoke
        run: npm run test:accessibility-auth

      - name: MongoDB diagnostics on failure
        if: failure()
        run: docker logs otp-mongo-accessibility-auth || true

      - name: Stop MongoDB test container
        if: always()
        run: docker rm -f otp-mongo-accessibility-auth || true

name: Phase 10 status sync

on:
  push:
    branches:
      - feat/phase-10-2-self-host-standalone

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/phase-10-2-self-host-standalone

      - name: Synchronize README and ROADMAP status
        run: node scripts/phase10-status-sync.mjs

      - name: Commit synchronized status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md ROADMAP.md ROADMAP.es.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize Phase 10 productisation status"
          git push origin HEAD:feat/phase-10-2-self-host-standalone

name: Fresh clone demo

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Clean install from lockfile
        run: npm ci --no-fund

      - name: Fresh-clone source invariants
        run: npm run check:fresh-clone

      - name: Create safe local demo configuration
        run: |
          rm -f .env.local
          npm run setup:demo
          test -f .env.local

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start production application
        run: |
          npm start > /tmp/open-travel-fresh-clone.log 2>&1 &
          echo $! > /tmp/open-travel-fresh-clone.pid
          ready=false
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/live >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/open-travel-fresh-clone.log || true
            exit 1
          fi

      - name: Fresh-clone HTTP smoke
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/trips >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/destinations >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/operator/sign-in >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live >/dev/null

      - name: Application diagnostics on failure
        if: failure()
        run: cat /tmp/open-travel-fresh-clone.log || true

      - name: Stop production application
        if: always()
        run: |
          if [ -f /tmp/open-travel-fresh-clone.pid ]; then
            kill "$(cat /tmp/open-travel-fresh-clone.pid)" || true
          fi

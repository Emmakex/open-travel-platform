name: Deployment recipe validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install from resolved lock
        run: npm ci --no-fund

      - name: Deployment recipe invariants
        run: npm run check:deployment-recipes

      - name: Render Compose recipes
        shell: bash
        run: |
          docker compose -f deploy/compose/compose.demo.yml config --quiet
          DUMMY_DIGEST="$(printf 'a%.0s' {1..64})"
          OTP_IMAGE="ghcr.io/emmakex/open-travel-platform@sha256:${DUMMY_DIGEST}" \
          OTP_ENV_FILE="../../.env.demo.example" \
          docker compose -f deploy/compose/compose.production.yml config --quiet

      - name: Render Kubernetes baseline
        run: kubectl kustomize deploy/kubernetes/base > /tmp/open-travel-platform-kubernetes.yaml

      - name: Real Compose build and smoke
        shell: bash
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/compose/compose.demo.yml"
          trap '$compose down --volumes --remove-orphans' EXIT
          $compose up -d --build --wait --wait-timeout 180
          test "$($compose exec -T app id -u)" = "10001"
          test "$($compose exec -T app id -g)" = "10001"
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready >/dev/null
          $compose ps

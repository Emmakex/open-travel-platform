name: Phase 10.1 lockfile bootstrap

on:
  push:
    branches:
      - feat/phase-10-1-fresh-clone-demo

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/phase-10-1-fresh-clone-demo

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate npm 11 lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Add reproducible npm lockfile"
          git push origin HEAD:feat/phase-10-1-fresh-clone-demo
